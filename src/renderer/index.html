<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adapta Browser</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Tab Bar with Window Controls -->
  <div id="tab-bar">
    <div class="drag-region"></div>
    <div id="tabs-container"></div>
    <button id="btn-new-tab" class="new-tab-btn" title="New Tab">+</button>
    <div class="window-controls">
      <button id="btn-minimize" class="window-btn" title="Minimize">−</button>
      <button id="btn-maximize" class="window-btn" title="Maximize">□</button>
      <button id="btn-close" class="window-btn close-btn" title="Close">×</button>
    </div>
  </div>

  <div id="toolbar">
    <!-- Navigation controls -->
    <div class="nav-controls">
      <button id="btn-back" class="nav-btn" title="Back">←</button>
      <button id="btn-forward" class="nav-btn" title="Forward">→</button>
      <button id="btn-reload" class="nav-btn" title="Reload">⟳</button>
    </div>

    <!-- URL bar -->
    <div class="url-container">
      <input type="text" id="url-bar" placeholder="Enter URL..." />
    </div>

    <!-- Action buttons -->
    <div class="action-controls">
      <button id="btn-screen" class="action-btn btn-analyze-events">🔍 Screen</button>
      <button id="btn-glm" class="action-btn btn-analyze-events">GLM</button>
      <button id="btn-settings" class="action-btn btn-settings">⚙️ Settings</button>
    </div>
  </div>

  <!-- The browser view will be positioned here by Electron -->

  <!-- Screening Modal -->
  <div id="screening-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 560px;">
      <h3>Ticker Screening</h3>
      <p>Screen tickers for significant recent price events.</p>
      <div class="modal-form">
        <div class="form-row-inline">
          <div class="form-field">
            <label for="screen-period">Period (trading days)</label>
            <input type="number" id="screen-period" value="100" min="30" max="1000" />
          </div>
          <div class="form-field">
            <label for="screen-lookback-days">Lookback Days</label>
            <input type="number" id="screen-lookback-days" value="5" min="1" max="30" />
          </div>
          <div class="form-field">
            <label for="screen-percentile">Percentile Threshold</label>
            <input type="number" id="screen-percentile" value="92" min="50" max="99" />
          </div>
        </div>
        <div style="margin-top: 10px;">
          <label for="screen-override-tickers" style="font-size: 0.85em;">Override tickers <span style="color: #999;">(optional — comma-separated, bypasses saved list)</span></label>
          <input type="text" id="screen-override-tickers" placeholder="e.g. AAPL, TSLA, NVDA" style="width: 100%; margin-top: 4px;" />
        </div>
        <div style="margin-top: 8px;">
          <label style="font-size: 0.85em; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" id="screen-fetch-news" />
            Fetch news headlines <span style="color: #999;">(slower — scrapes Finviz per ticker)</span>
          </label>
        </div>
        <div style="margin-top: 8px;">
          <label style="font-size: 0.85em; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" id="screen-favorites-only" />
            Favorites only <span style="color: #999;">(run only starred tickers)</span>
          </label>
        </div>
      </div>
      <div class="modal-buttons">
        <button id="screen-cancel" class="btn-modal btn-cancel">Cancel</button>
        <select id="screen-view-screening" class="btn-modal btn-cancel" style="flex: 0 0 auto;">
          <option value="" disabled selected>Latest Run Results ▾</option>
        </select>
        <button id="screen-run" class="btn-modal btn-primary">Run Screening</button>
      </div>
      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; display: flex; gap: 8px;">
        <button id="screen-revise" class="btn-modal btn-primary" style="flex: 1; background: #ff9800;">Revise the 100</button>
        <button id="screen-view-last" class="btn-modal btn-cancel" style="flex: 0 0 auto;">View Last</button>
      </div>
      <div style="font-size: 0.8em; color: #888; margin-top: 4px;">Auto-select best 100 tickers from ~200 universe by revenue growth, leverage, and liquidity.</div>
    </div>
  </div>

  <!-- GLM Analysis Modal -->
  <div id="glm-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 720px; max-height: 85vh; overflow-y: auto;">
      <h3>GLM: Predict Stock Direction</h3>
      <p>Logistic regression on event features to predict up/down over N forward days.</p>
      <div class="modal-form">
        <div class="form-row-inline">
          <div class="form-field">
            <label for="glm-horizon">Horizon (trading days)</label>
            <select id="glm-horizon">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-buttons">
        <button id="glm-cancel" class="btn-modal btn-cancel">Cancel</button>
        <button id="glm-train" class="btn-modal btn-primary">Train Model</button>
      </div>
      <div id="glm-results" style="margin-top: 16px; display: none;"></div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast-container"></div>

  <!-- Bottom bar with ticker input, action buttons, and stats -->
  <div id="analysis-bar">
    <div class="bottom-bar-left">
      <label class="all-stocks-label" title="Save as market-wide news (applies to all stocks)">
        <input type="checkbox" id="all-stocks-checkbox" />
        All
      </label>
      <input type="text" id="ticker-input" placeholder="Tickers (e.g. AAPL, TSLA)" title="Add or override stock tickers" />
      <button id="btn-analyze" class="action-btn-sm btn-analyze">📈 Save Stock News</button>
      <button id="btn-count-news" class="action-btn-sm btn-count-news">📊 Count News</button>
      <button id="btn-not-good" class="action-btn-sm btn-not-good">Not Good</button>
    </div>
    <span id="analysis-text" style="display: none;"></span>
    <span id="stats-text-bottom">Not Good: 0</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Adapta Screening</title>
    <style>
      :root { --bg:#0f1115; --panel:#1a1d24; --fg:#e6e8ec; --muted:#8b93a1; --accent:#4c8bf5; --err:#e5534b; --ok:#3fb950; --border:#262a33; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); -webkit-text-size-adjust:100%; }
      header { padding:14px 16px; font-weight:600; font-size:18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg); z-index:10; }
      header .gear { font-size:20px; background:none; border:none; color:var(--muted); padding:4px 8px; }
      main { padding:14px; max-width:820px; margin:0 auto; }
      .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
      .panel h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
      label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
      input, select { width:100%; padding:10px; border-radius:8px; border:1px solid #333844; background:#0d0f14; color:var(--fg); font-size:15px; }
      textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #333844; background:#0d0f14; color:var(--fg); font-size:15px; resize:vertical; min-height:52px; }
      button { padding:11px 16px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; }
      button.secondary { background:#2a2f3a; }
      button:disabled { opacity:.5; }
      .inline { display:flex; gap:10px; align-items:center; }
      .inline > * { flex:1; }
      .checkbox { display:flex; align-items:center; gap:8px; margin-top:12px; }
      .checkbox input { width:auto; }
      .status { font-size:13px; color:var(--muted); margin-top:10px; min-height:18px; }
      .status.err { color:var(--err); }
      .progress { height:6px; background:#0d0f14; border-radius:3px; overflow:hidden; margin-top:10px; }
      .progress > div { height:100%; background:var(--accent); width:0; transition:width .2s; }
      table { width:100%; border-collapse:collapse; font-size:13px; }
      th, td { text-align:right; padding:8px 6px; border-bottom:1px solid var(--border); white-space:nowrap; }
      th:first-child, td:first-child { text-align:left; }
      th { color:var(--muted); font-weight:600; cursor:pointer; user-select:none; font-size:11px; text-transform:uppercase; }
      tr.data-row { cursor:pointer; }
      tr.data-row:hover td { background:#20242d; }
      .detail td { background:#12151b; }
      .tag { display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:600; }
      .muted { color:var(--muted); }
      .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; margin:8px 0; }
      .kv .k { color:var(--muted); }
      canvas { margin-top:10px; background:#0d0f14; border-radius:8px; }
      .hidden { display:none; }
      .scroll { overflow-x:auto; }
    </style>
  </head>
  <body>
    <header>
      <span>Adapta Screening</span>
      <button class="gear" id="toggle-settings" title="Settings">⚙︎</button>
    </header>
    <main>
      <section class="panel hidden" id="settings-panel">
        <h2>Settings</h2>
        <label>Twelve Data API key</label>
        <input id="cfg-twelve" type="password" placeholder="stock price data" />
        <label>EODHD API key (fallback)</label>
        <input id="cfg-eodhd" type="password" placeholder="fallback price data" />
        <label>Supabase URL</label>
        <input id="cfg-supabase-url" type="text" placeholder="https://xxxx.supabase.co" />
        <label>Supabase anon key</label>
        <input id="cfg-supabase-key" type="password" placeholder="anon public key" />
        <button id="save-config" style="margin-top:12px;">Save settings</button>
        <div class="status" id="config-status"></div>
      </section>

      <section class="panel">
        <h2>Run screening</h2>
        <label>Tickers (comma or space separated)</label>
        <textarea id="tickers" placeholder="AAPL, MSFT, NVDA"></textarea>
        <div class="inline" style="margin-top:10px;">
          <div>
            <label>Period (trading days)</label>
            <input id="period" type="number" value="200" />
          </div>
          <div>
            <label>Hold horizon (days)</label>
            <input id="hold-days" type="number" value="60" />
          </div>
        </div>
        <div class="checkbox"><input id="opt-options" type="checkbox" checked /><label style="margin:0;">Analyze options (Yahoo)</label></div>
        <button id="run" style="margin-top:14px; width:100%;">Run screening</button>
        <div class="progress hidden" id="progress"><div></div></div>
        <div class="status" id="run-status"></div>
      </section>

      <section class="panel hidden" id="results-panel">
        <h2>Results</h2>
        <div class="scroll">
          <table id="results-table">
            <thead>
              <tr>
                <th data-sort="ticker">Ticker</th>
                <th data-sort="price">Price</th>
                <th data-sort="events">Events</th>
                <th data-sort="classification">Signal</th>
                <th data-sort="pcr">P/C</th>
                <th data-sort="atmIV">ATM IV</th>
                <th data-sort="sentiment">Sentiment</th>
                <th data-sort="hold">Hold</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
